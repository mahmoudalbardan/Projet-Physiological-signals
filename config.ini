splitdir = F:/PSA BACKUP/data_1/dataframes/splited_by_slaloms_using_detection.mat
baredir = F:/PSA BACKUP/data_1/dataframes/bare
job = split 


[EDA processing]
destinationdir = F:/data/backups/1manip/dataframes/data/eda_d2_med_mit
sampling_rate = 1000
resampling_rate = 8 
